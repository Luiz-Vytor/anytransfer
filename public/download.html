<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="下载您的文件 - AnyTransfer 临时文件传输">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>下载文件 - AnyTransfer</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .hidden {
            display: none !important;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
        }

        .file-preview {
            margin-bottom: 2rem;
        }

        .file-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .file-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            word-break: break-all;
        }

        .file-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .file-meta-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .btn {
            width: 100%;
            padding: 1rem 2rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #a855f7);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .warning {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            border-radius: 0.5rem;
            color: var(--warning);
            font-size: 0.875rem;
        }

        .pending-notice {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--accent);
            border-radius: 0.5rem;
            color: var(--accent);
            font-size: 0.875rem;
        }

        .error {
            padding: 2rem;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .error-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .error-message {
            color: var(--text-secondary);
        }

        .loading {
            padding: 3rem;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        .home-link {
            margin-top: 2rem;
            text-align: center;
        }

        .home-link a {
            color: var(--accent);
            text-decoration: none;
        }

        .home-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <h1>🚀 AnyTransfer</h1>
            <p>安全便捷的临时文件传输</p>
        </div>

        <div class="card">
            <!-- Loading -->
            <div id="loadingState" class="loading">
                <div class="spinner"></div>
                <div>加载中...</div>
            </div>

            <!-- File Info -->
            <div id="fileState" class="hidden">
                <div id="pendingNotice" class="pending-notice hidden pulse">
                    ⏳ 文件正在上传中，请稍等...
                </div>
                <div class="file-preview">
                    <div class="file-icon">📄</div>
                    <div id="fileName" class="file-name">-</div>
                    <div class="file-meta">
                        <span class="file-meta-item">📦 <span id="fileSize">-</span></span>
                        <span class="file-meta-item">⏰ <span id="expiresAt">-</span></span>
                        <span class="file-meta-item">📥 <span id="downloads">-</span></span>
                    </div>
                </div>
                <button id="downloadBtn" class="btn btn-primary">
                    <span>⬇️</span>
                    <span>下载文件</span>
                </button>
                <div id="warningBox" class="warning hidden"></div>
            </div>

            <!-- Error -->
            <div id="errorState" class="error hidden">
                <div class="error-icon">😢</div>
                <div class="error-title">文件不可用</div>
                <div id="errorMessage" class="error-message">文件已过期或被删除</div>
            </div>
        </div>

        <div class="home-link" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="/">← 返回主页上传文件</a>
            <button id="reportBtn" class="hidden"
                style="background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 0.75rem;">
                🚩 举报此文件
            </button>
        </div>
    </div>

    <!-- Report Modal -->
    <div id="reportModal" class="hidden"
        style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: var(--bg-card); border-radius: 1rem; padding: 1.5rem; max-width: 400px; width: 90%;">
            <h3 style="margin-bottom: 1rem;">🚩 举报此文件</h3>
            <p style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1rem;">
                如果此文件包含违规内容，请告诉我们。
            </p>
            <select id="reportReason"
                style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 0.5rem; color: var(--text-primary); margin-bottom: 0.75rem;">
                <option value="">选择原因...</option>
                <option value="illegal">违法内容</option>
                <option value="copyright">侵犯版权</option>
                <option value="malware">恶意软件/病毒</option>
                <option value="privacy">侵犯隐私</option>
                <option value="other">其他</option>
            </select>
            <input id="reportEmail" type="email" placeholder="您的邮箱（可选，用于反馈）"
                style="width: 100%; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 0.5rem; color: var(--text-primary); margin-bottom: 1rem;">
            <div style="display: flex; gap: 0.5rem;">
                <button id="cancelReport"
                    style="flex: 1; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 0.5rem; color: var(--text-primary); cursor: pointer;">取消</button>
                <button id="submitReport"
                    style="flex: 1; padding: 0.75rem; background: var(--accent); border: none; border-radius: 0.5rem; color: white; cursor: pointer;">提交举报</button>
            </div>
            <div id="reportResult" style="margin-top: 1rem; text-align: center; font-size: 0.875rem;"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        const loadingState = document.getElementById('loadingState');
        const fileState = document.getElementById('fileState');
        const errorState = document.getElementById('errorState');
        const pendingNotice = document.getElementById('pendingNotice');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const expiresAt = document.getElementById('expiresAt');
        const downloads = document.getElementById('downloads');
        const downloadBtn = document.getElementById('downloadBtn');
        const warningBox = document.getElementById('warningBox');
        const errorMessage = document.getElementById('errorMessage');

        // Get transfer ID from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const transferId = urlParams.get('id');

        let fileStatus = null;

        // Format file size
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        // Format relative time
        function formatRelativeTime(timestamp) {
            const diff = timestamp - Date.now();
            if (diff <= 0) return '已过期';
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            if (hours > 24) {
                return Math.floor(hours / 24) + '天后过期';
            }
            if (hours > 0) {
                return hours + '小时后过期';
            }
            return minutes + '分钟后过期';
        }

        // Load file info
        async function loadFileInfo() {
            // Reset all states first
            errorState.classList.add('hidden');
            pendingNotice.classList.add('hidden');
            warningBox.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE}/api/status/${transferId}`);
                const data = await response.json();
                console.log('[DEBUG] Status API response:', JSON.stringify(data));

                if (!data.success) {
                    showError(data.error || '文件已过期或被删除');
                    return false;
                }

                if (data.expired) {
                    showError('文件已过期或下载次数已达上限');
                    return false;
                }

                fileStatus = data;

                // Show file info
                loadingState.classList.add('hidden');
                fileState.classList.remove('hidden');

                // Check if upload is still pending (use 'ready' field from API)
                if (!data.ready) {
                    pendingNotice.classList.remove('hidden');
                    downloadBtn.disabled = true;
                    downloadBtn.innerHTML = '<span>⏳</span><span>等待上传完成...</span>';
                    fileName.textContent = '文件上传中...';
                    fileSize.textContent = '-';
                    expiresAt.textContent = formatRelativeTime(data.expiresAt);
                    downloads.textContent = `${data.downloads}/${data.maxDownloads} 次下载`;
                    // Poll for completion
                    setTimeout(loadFileInfo, 2000);
                    return true;
                }

                pendingNotice.classList.add('hidden');
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<span>⬇️</span><span>下载文件</span>';

                fileName.textContent = data.filename;
                fileSize.textContent = formatSize(data.size);
                expiresAt.textContent = formatRelativeTime(data.expiresAt);
                downloads.textContent = `${data.downloads}/${data.maxDownloads} 次下载`;

                // Warning if almost out of downloads
                const remaining = data.maxDownloads - data.downloads;
                if (remaining <= 2) {
                    warningBox.classList.remove('hidden');
                    warningBox.textContent = `⚠️ 仅剩 ${remaining} 次下载机会`;
                }

                // Show report button
                if (typeof enableReportBtn === 'function') enableReportBtn();

                return true;

            } catch (error) {
                showError('加载失败，请稍后重试');
                return false;
            }
        }

        function showError(message) {
            console.log('[DEBUG] showError:', message);
            loadingState.classList.add('hidden');
            fileState.classList.add('hidden');
            pendingNotice.classList.add('hidden');
            errorState.classList.remove('hidden');
            errorMessage.textContent = message;
        }

        // Download file using signed URL
        downloadBtn.addEventListener('click', async () => {
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '<span>⏳</span><span>获取下载链接...</span>';

            try {
                // Get signed download URL
                const response = await fetch(`${API_BASE}/api/sign/${transferId}`);
                const data = await response.json();

                if (!data.success) {
                    if (data.error === 'Download limit reached') {
                        showError('下载次数已达上限');
                    } else if (data.error === 'File expired') {
                        showError('文件已过期');
                    } else {
                        showError(data.error || '获取下载链接失败');
                    }
                    return;
                }

                // Trigger download using signed URL
                const a = document.createElement('a');
                a.href = data.url;
                a.download = data.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                // Update UI
                downloadBtn.innerHTML = '<span>✅</span><span>下载已开始</span>';

                // Update remaining downloads display
                downloads.textContent = `${fileStatus.downloads + 1}/${fileStatus.maxDownloads} 次下载`;

                const remaining = data.downloadsRemaining;
                if (remaining <= 0) {
                    showError('下载次数已达上限');
                } else if (remaining <= 2) {
                    warningBox.classList.remove('hidden');
                    warningBox.textContent = `⚠️ 仅剩 ${remaining} 次下载机会`;
                }

                // Re-enable after delay
                setTimeout(() => {
                    downloadBtn.disabled = false;
                    downloadBtn.innerHTML = '<span>⬇️</span><span>下载文件</span>';
                }, 3000);

            } catch (error) {
                console.error('Download error:', error);
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = '<span>⬇️</span><span>下载文件</span>';
                showError('下载失败，请稍后重试');
            }
        });

        // Init
        if (!transferId) {
            showError('无效的下载链接');
        } else {
            loadFileInfo();
        }

        // Report functionality
        const reportBtn = document.getElementById('reportBtn');
        const reportModal = document.getElementById('reportModal');
        const reportReason = document.getElementById('reportReason');
        const reportEmail = document.getElementById('reportEmail');
        const cancelReport = document.getElementById('cancelReport');
        const submitReport = document.getElementById('submitReport');
        const reportResult = document.getElementById('reportResult');

        // Show report button when file is loaded
        function enableReportBtn() {
            reportBtn.classList.remove('hidden');
        }

        reportBtn.addEventListener('click', () => {
            reportModal.classList.remove('hidden');
            reportModal.style.display = 'flex';
        });

        cancelReport.addEventListener('click', () => {
            reportModal.classList.add('hidden');
            reportModal.style.display = 'none';
        });

        submitReport.addEventListener('click', async () => {
            const reason = reportReason.value;
            if (!reason) {
                reportResult.textContent = '请选择举报原因';
                reportResult.style.color = 'var(--error)';
                return;
            }

            submitReport.disabled = true;
            submitReport.textContent = '提交中...';

            try {
                const res = await fetch(`${API_BASE}/api/report/${transferId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reason: reason,
                        email: reportEmail.value
                    })
                });
                const data = await res.json();

                if (data.success) {
                    reportResult.textContent = '✅ 举报已提交，感谢您的反馈！';
                    reportResult.style.color = 'var(--success)';
                    setTimeout(() => {
                        reportModal.classList.add('hidden');
                        reportModal.style.display = 'none';
                    }, 2000);
                } else {
                    reportResult.textContent = data.error || '提交失败';
                    reportResult.style.color = 'var(--error)';
                }
            } catch (err) {
                reportResult.textContent = '网络错误，请稍后重试';
                reportResult.style.color = 'var(--error)';
            }

            submitReport.disabled = false;
            submitReport.textContent = '提交举报';
        });
    </script>

    <div style="position: fixed; bottom: 1rem; right: 1rem; opacity: 0.7;">
        <a href="https://github.com/Myfastools/anytransfer" target="_blank"
            style="display: flex; align-items: center; gap: 0.5rem; color: #a1a1aa; text-decoration: none; font-size: 0.75rem; transition: opacity 0.2s;"
            onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">
            <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
                <path
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
            </svg>
            ⭐ Star on GitHub
        </a>
    </div>
</body>

</html>
