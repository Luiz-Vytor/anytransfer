<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - AnyTransfer</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #1a1a24;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent: #6366f1;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
            --border: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.875rem;
        }

        .tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        td {
            font-size: 0.875rem;
        }

        .status {
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-ready {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .status-banned {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .btn {
            padding: 0.5rem 0.75rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .admin-badge {
            background: var(--accent);
            color: white;
            font-size: 0.625rem;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .empty {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .back-link {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/" class="back-link">← 返回首页</a>
        <h1>🛠️ 管理后台</h1>

        <div id="accessDenied" class="hidden" style="text-align: center; padding: 3rem;">
            <h2>🚫 访问被拒绝</h2>
            <p style="color: var(--text-secondary); margin-top: 1rem;">您需要管理员权限才能访问此页面</p>
            <a href="/auth/github" class="btn btn-secondary" style="margin-top: 1rem; display: inline-block;">登录
                GitHub</a>
        </div>

        <div id="adminContent" class="hidden">
            <div class="tabs">
                <div class="tab active" data-tab="transfers">📁 文件管理</div>
                <div class="tab" data-tab="users">👥 用户管理</div>
            </div>

            <div id="transfers" class="panel active">
                <div id="transfersLoading" class="loading">加载中...</div>
                <div id="transfersEmpty" class="empty hidden">暂无文件</div>
                <table id="transfersTable" class="hidden">
                    <thead>
                        <tr>
                            <th>提取码</th>
                            <th>文件名</th>
                            <th>大小</th>
                            <th>状态</th>
                            <th>创建时间</th>
                            <th>下载次数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="transfersBody"></tbody>
                </table>
            </div>

            <div id="users" class="panel">
                <div id="usersLoading" class="loading">加载中...</div>
                <div id="usersEmpty" class="empty hidden">暂无用户</div>
                <table id="usersTable" class="hidden">
                    <thead>
                        <tr>
                            <th>用户</th>
                            <th>GitHub ID</th>
                            <th>最后登录</th>
                            <th>注册时间</th>
                        </tr>
                    </thead>
                    <tbody id="usersBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        // Check admin access
        async function checkAccess() {
            const res = await fetch(API + '/api/me', { credentials: 'include' });
            const data = await res.json();

            // For now, check if authenticated (admin check is on backend)
            if (data.authenticated) {
                document.getElementById('adminContent').classList.remove('hidden');
                loadTransfers();
            } else {
                document.getElementById('accessDenied').classList.remove('hidden');
            }
        }

        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');

                if (tab.dataset.tab === 'users') loadUsers();
            });
        });

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        function formatTime(ts) {
            return new Date(ts).toLocaleString('zh-CN');
        }

        // Load transfers
        async function loadTransfers() {
            try {
                const res = await fetch(API + '/admin/transfers', { credentials: 'include' });
                const data = await res.json();

                document.getElementById('transfersLoading').classList.add('hidden');

                if (!data.success) {
                    document.getElementById('accessDenied').classList.remove('hidden');
                    document.getElementById('adminContent').classList.add('hidden');
                    return;
                }

                if (data.transfers.length === 0) {
                    document.getElementById('transfersEmpty').classList.remove('hidden');
                    return;
                }

                document.getElementById('transfersTable').classList.remove('hidden');
                const tbody = document.getElementById('transfersBody');
                tbody.innerHTML = data.transfers.map(t => `
          <tr>
            <td><code>${t.id}</code></td>
            <td>${t.filename || '-'}</td>
            <td>${formatSize(t.size)}</td>
            <td><span class="status status-${t.status}">${t.status}</span></td>
            <td>${formatTime(t.createdAt)}</td>
            <td>${t.downloads}/${t.maxDownloads}</td>
            <td>
              ${t.status === 'banned'
                        ? `<button class="btn btn-success" onclick="unbanFile('${t.id}')">解封</button>`
                        : `<button class="btn btn-danger" onclick="banFile('${t.id}')">封禁</button>`
                    }
            </td>
          </tr>
        `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('transfersLoading').textContent = '加载失败';
            }
        }

        // Load users
        async function loadUsers() {
            try {
                const res = await fetch(API + '/admin/users', { credentials: 'include' });
                const data = await res.json();

                document.getElementById('usersLoading').classList.add('hidden');

                if (!data.success || data.users.length === 0) {
                    document.getElementById('usersEmpty').classList.remove('hidden');
                    return;
                }

                document.getElementById('usersTable').classList.remove('hidden');
                const tbody = document.getElementById('usersBody');
                tbody.innerHTML = data.users.map(u => `
          <tr>
            <td>
              <div class="user-row">
                <img class="avatar" src="${u.avatar_url}" alt="">
                <span>${u.name || u.login}</span>
                ${u.is_admin ? '<span class="admin-badge">管理员</span>' : ''}
              </div>
            </td>
            <td>${u.github_id}</td>
            <td>${formatTime(u.last_login_at)}</td>
            <td>${formatTime(u.created_at)}</td>
          </tr>
        `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('usersLoading').textContent = '加载失败';
            }
        }

        // Ban file
        async function banFile(id) {
            const reason = prompt('封禁原因：');
            if (reason === null) return;

            await fetch(API + `/admin/ban/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ reason })
            });
            loadTransfers();
        }

        // Unban file
        async function unbanFile(id) {
            await fetch(API + `/admin/unban/${id}`, {
                method: 'POST',
                credentials: 'include'
            });
            loadTransfers();
        }

        checkAccess();
    </script>
</body>

</html>
